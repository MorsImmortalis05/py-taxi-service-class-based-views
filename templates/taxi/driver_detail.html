<{% extends "base.html" %}

{% block content %}
    <h1>Driver: ({{ Driver.nickname }})</h1>
    <div class="ml-r">
      <h3>Cars: </h3>
    {% for car in Driver.cars.all %}
      <hr>
      <p class="text-muted">{{ author.id }}</p>
      <p>{{ car.manufacturer }} {{ car.model }}
      </p>
      {% empty %}
        <p>No cars!</p>
    {% endfor %}
    </div>
{% endblock %}
